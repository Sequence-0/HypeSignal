[project]
name = "hypesignal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rugved", email = "rugved.dharankar@gmail.com" }
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "duckdb>=1.0.0",
    "fastapi>=0.110.0",
    "langdetect>=1.0.9",
    "polars>=1.0.0",
    "pyarrow>=17.0.0",
    "pydantic>=2.7.0",
    "pytz>=2024.1",
    "qdrant-client>=1.9.0",
    "scipy>=1.12.0",
    "sentence-transformers>=2.5.0",
    "spacy>=3.7.0",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "torch>=2.2.0",
    "transformers>=4.40.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
hypesignal = "hypesignal:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["Dataset", ".venv", "build", "dist"]
